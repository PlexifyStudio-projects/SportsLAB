name: Deploy a GitHub Pages

# Construye la landing con Vite y publica `dist/` en la rama `gh-pages`.
# Este método no usa la API de habilitación de Pages (evita el error
# "Resource not accessible by integration" cuando la organización la restringe).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build
        env:
          # GitHub Pages sirve el sitio en /SportsLAB/; Cloudflare lo sirve en la
          # raíz de abrahamsportslab.com. El subpath se inyecta SOLO aquí.
          DEPLOY_BASE: /SportsLAB/

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Evita que GitHub procese el sitio con Jekyll.
          enable_jekyll: false
